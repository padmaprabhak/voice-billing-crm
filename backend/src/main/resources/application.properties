# ?? Application ??????????????????????????????????????????????????????
spring.application.name=billing-crm-backend
server.port=8080
server.servlet.context-path=/api

# ?? Database ?????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/billing_crm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# ?? JPA / Hibernate ???????????????????????????????????????????????????
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ?? Security ? JWT ????????????????????????????????????????????????????
# IMPORTANT: must be at least 64 characters (512 bits) for HS512
# Change this to a long random string ? never commit the real value
app.jwt.secret=VoiceBillCRM2026SuperSecretKeyForJWTSigningMustBe64CharsMinimumLength!!
app.jwt.expiration-ms=86400000

# ?? CORS ?????????????????????????????????????????????????????????????
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ?? AI service ???????????????????????????????????????????????????????
app.ai-service.base-url=http://localhost:5000/api

# ?? Actuator ?????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ?? SpringDoc ????????????????????????????????????????????????????????
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ?? Logging ? enable JWT debug to diagnose 403s ???????????????????????
logging.level.com.billingcrm=DEBUG
logging.level.com.billingcrm.security=DEBUG
logging.level.org.springframework.security=INFO